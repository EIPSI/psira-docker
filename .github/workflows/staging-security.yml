name: Staging Security

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Public staging URL to scan, for example https://staging.psira.net
        required: true
        type: string
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  zap-baseline:
    name: OWASP ZAP baseline
    runs-on: ubuntu-latest
    steps:
      - name: Copy repository
        uses: actions/checkout@v4

      - name: Resolve target
        id: target
        run: |
          if [ -n "${{ inputs.target_url }}" ]; then
            echo "url=${{ inputs.target_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ secrets.PSIRA_STAGING_URL }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop when target is not configured
        if: steps.target.outputs.url == ''
        run: |
          echo "Set PSIRA_STAGING_URL or pass target_url when running this workflow."
          exit 1

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ steps.target.outputs.url }}
          rules_file_name: .zap/rules.tsv
          fail_action: true

  zap-graphql:
    name: OWASP ZAP GraphQL API
    runs-on: ubuntu-latest
    needs: zap-baseline
    steps:
      - name: Copy repository
        uses: actions/checkout@v4

      - name: Resolve GraphQL schema
        id: graphql
        run: |
          if [ -n "${{ secrets.PSIRA_GRAPHQL_SCHEMA_URL }}" ]; then
            echo "schema=${{ secrets.PSIRA_GRAPHQL_SCHEMA_URL }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip when GraphQL schema URL is not configured
        if: steps.graphql.outputs.schema == ''
        run: echo "Set PSIRA_GRAPHQL_SCHEMA_URL to enable the ZAP GraphQL scan."

      - name: Run ZAP GraphQL API scan
        if: steps.graphql.outputs.schema != ''
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: ${{ steps.graphql.outputs.schema }}
          format: graphql
          rules_file_name: .zap/rules.tsv
          fail_action: true

  http-observatory:
    name: Mozilla HTTP Observatory
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target host
        id: target
        run: |
          TARGET="${{ inputs.target_url }}"
          if [ -z "$TARGET" ]; then
            TARGET="${{ secrets.PSIRA_STAGING_URL }}"
          fi
          if [ -z "$TARGET" ]; then
            echo "Set PSIRA_STAGING_URL or pass target_url when running this workflow."
            exit 1
          fi
          HOST="$(python3 -c 'from urllib.parse import urlparse; import sys; print(urlparse(sys.argv[1]).netloc or sys.argv[1])' "$TARGET")"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"

      - name: Run HTTP Observatory scan
        run: |
          RESPONSE="$(curl -fsS -X POST "https://observatory-api.mdn.mozilla.net/api/v2/scan?host=${{ steps.target.outputs.host }}")"
          echo "$RESPONSE"
          SCORE="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("score", 0))' <<< "$RESPONSE")"
          if [ "$SCORE" -lt 80 ]; then
            echo "HTTP Observatory score is below 80."
            exit 1
          fi
