version: "3.9"

services:
  ### PSIRA Frontend Container ###########################

  psira-frontend:
    build: 
      context: ./psira-frontend
      args: 
        email: ${FRONTEND_MAIL}
        version: ${APP_VERSION}
    restart: unless-stopped
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
    tty: true
    networks:
      - frontend

  ### PSIRA Backend Container ###########################

  psira-backend:
    build: 
      context: ./psira-backend
      args:
        version: ${APP_VERSION}
    restart: unless-stopped
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
    environment:
      - SECRET=${JWT_SECRET}
      - SERVER_PORT=3000
      - TYPEORM_CONNECTION=postgres
      - TYPEORM_HOST=postgres
      - TYPEORM_USERNAME=${POSTGRES_USER}
      - TYPEORM_DATABASE=${POSTGRES_DB}
      - TYPEORM_PASSWORD=${POSTGRES_PASSWORD}
      - TYPEORM_PORT=5432
      - TYPEORM_SSL=true
      - TYPEORM_SSL_REJECT_UNAUTHORIZED=false
      - TYPEORM_SYNCHRONIZE=false
      - TYPEORM_LOGGING=true
      - TYPEORM_ENTITIES_DIR=/../**/*.model.{js,ts}
      - TYPEORM_MIGRATIONS_TABLE_NAME=migrations
      - TYPEORM_MIGRATIONS=./dist/migrations/*.js
      - TYPEORM_MIGRATIONS_DIR=src/migrations
      - TYPEORM_MIGRATIONS_RUN=true
      - CACHE_STORE=redis
      - REDIS_HOST=redis
      - MONGODB_CONNECTION_STRING=${MONGODB_CONNECTION_STRING}
      - SUPERADMIN_USERNAME=${SUPERADMIN_USERNAME}
      - SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD}
      - GRAPHQL_PLAYGROUND_ENABLED=${GRAPHQL_PLAYGROUND_ENABLED}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_SECURE=${MAIL_SECURE}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASS=${MAIL_PASS}
      - SENDER_MAIL=${SENDER_MAIL}
      - FRONTEND_ENCRYPTION_KEY=${FRONTEND_ENCRYPTION_KEY}
      - APP_URL=${APP_URL}
      - SHINY_APPS_DIR=/opt/psira-shiny/shiny_apps
      - REPORT_EMBED_SECRET=${JWT_SECRET}
      - REPORT_EMBED_TOKEN_TTL=300
    volumes:
      - ${SHINY_APPS_PATH}/shiny_apps:/opt/psira-shiny/shiny_apps:ro
    tty: true
    networks:
      - frontend
      - backend
      - shiny
    depends_on:
      - redis
      - postgres
      - mongo
    command: ["./start.sh"]

  ### Caddy Server Container ##################################

  caddy:
    build: ./caddy
    restart: unless-stopped
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN}
    volumes:
      - ${CADDY_CUSTOM_CADDYFILE}:/etc/caddy/Caddyfile
      - ${CADDY_HOST_LOG_PATH}:/var/log/caddy
      - ${DATA_SAVE_PATH}/caddy:/root/.caddy
    ports:
      - "${CADDY_HOST_HTTP_PORT}:80"
      - "${CADDY_HOST_HTTPS_PORT}:443"
    depends_on:
      - psira-frontend
      - psira-backend
    networks:
      - frontend
      - backend
      - shiny

  ### PostgreSQL Container ####################################

  postgres:
    build: ./postgres
    restart: unless-stopped
    volumes:
      - ${DATA_SAVE_PATH}/postgres/data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - backend
      - backup-network

  ### MongoDB Container #######################################

  mongo:
    build: ./mongo
    restart: unless-stopped
    volumes:
      - ${DATA_SAVE_PATH}/mongo:/data/db
    networks:
      - backend
      - backup-network

  ### Redis Container #########################################

  redis:
    build: ./redis
    restart: unless-stopped
    volumes:
      - ${DATA_SAVE_PATH}/redis:/data
    networks:
      - backend

  ### Shiny Container #########################################
  shiny:
    image: rocker/shiny:4
    build: ./shiny
    restart: unless-stopped
    volumes:
      - ${SHINY_APPS_PATH}/shiny_apps:/srv/shiny-server/shiny
      - ${SHINY_APPS_PATH}/graphql_functions:/opt/psira-shared/graphql_functions
      - ${SHINY_APPS_PATH}/utility_functions:/opt/psira-shared/utility_functions
      - ${SHINY_APPS_PATH}/www:/opt/psira-shared/www
    environment:
      - REPORT_EMBED_SECRET=${JWT_SECRET}
    networks:
      - shiny

### Backups Container #########################################
  backup:
    build:
      context: ./backup
    restart: unless-stopped
    depends_on:
      - postgres
      - mongo
    volumes:
      - ${DATA_SAVE_PATH}:/data
      - ${DATA_BACKUP_PATH}:/backups
      - ${DATA_BACKUP_LOG_PATH}:/var/log/
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - MONGODB_CONNECTION_STRING=${MONGODB_CONNECTION_STRING}
    networks:
      - backup-network

### Networks Setup ############################################

networks:
  frontend:
    driver: "bridge"
  backend:
    driver: "bridge"
  shiny:
    driver: "bridge"
  backup-network:
    driver: "bridge"

### Volumes Setup #############################################

volumes:
  postgres:
    driver: "local"
  redis:
    driver: "local"
  mongo:
    driver: "local"
  shiny_apps:
    driver: "local"
